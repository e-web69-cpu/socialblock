name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode debug keystore
        run: base64 -d debug-keystore.b64 > app/debug.keystore

      - name: Decode release keystore
        run: base64 -d release-keystore.b64 > app/release.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release AAB
        run: gradle bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socialblock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: socialblock-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish APK to apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apkpub
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkpub/SociaLock-latest.apk
          cd /tmp/apkpub
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
