name: Build call test APK

on:
  push:
    branches: [ main ]
    paths: [ 'calltest/**', '.github/workflows/calltest.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: calltest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to calltest-apk branch
        run: |
          mkdir -p /tmp/pub
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/pub/Hivas-teszt.apk
          cd /tmp/pub
          git init -q -b calltest-apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Hivas-teszt ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" calltest-apk
