<!doctype html><html lang="hu"><head><meta charset="utf-8"><title>SociaLock</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f7f9fc;--card:#fff;--ink:#0f172a;--muted:#5d6670;--blue:#2D65F8;--green:#10B981}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf3;--muted:#9aa5b8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{background:var(--card);border-radius:20px;padding:40px 36px;max-width:440px;margin:16px;text-align:center;box-shadow:0 10px 40px rgba(15,23,42,.08)}
img{width:96px;height:96px}
h1{margin:12px 0 4px;font-size:28px}h1 b{color:var(--blue)}h1 i{font-style:normal;color:var(--green)}
.pill{display:inline-block;border:1.5px solid var(--green);color:var(--green);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;letter-spacing:.06em}
p{color:var(--muted)}.site{font-weight:700;color:var(--ink)}
</style></head><body><main>
<img src="logo.png" alt="SociaLock">
<h1><b>S</b>ocia<i>L</i>ock</h1>
<span class="pill">AKTÍV</span>
<p><span class="site" id="site"></span> a tiltási időszakban nem érhető el.</p>
<p>Önkorlátozás józan ésszel. A tiltás feloldása csak a telefonos appban, segítővel lehetséges.</p>
</main><script src="blocked.js"></script></body></html>
